<title>Abertura e oferta</title>
<style>
  :root { --page:#EEF0EC; --fg:#111315; --fg2:#454A4F; --line:#C9CDC6; --chip:#FFFFFF; --pick:#2350D8; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page:#0E1012; --fg:#EEEFEB; --fg2:#B5B9B4; --line:#30343A; --chip:#1D2024; --pick:#8AA8FF; color-scheme: dark; } }
  :root[data-theme="dark"] { --page:#0E1012; --fg:#EEEFEB; --fg2:#B5B9B4; --line:#30343A; --chip:#1D2024; --pick:#8AA8FF; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background: var(--page); color: var(--fg); font-family: -apple-system, "Inter", "Segoe UI", Arial, sans-serif; }
  .wrap { padding-block: 24px 48px; padding-inline: 16px; max-width: 1240px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 6px; text-wrap: balance; }
  h2 { font-size: 17px; margin: 30px 0 6px; text-wrap: balance; }
  .lead { font-size: 14px; line-height: 1.5; color: var(--fg2); max-width: 86ch; margin: 0 0 14px; }
  .bar { display:flex; gap:8px; flex-wrap: wrap; margin: 6px 0 18px; }
  .bar button { font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); color: var(--fg); cursor: pointer; }
  .bar button[aria-pressed="true"] { border-color: var(--pick); outline: 2px solid var(--pick); outline-offset: -1px; font-weight: 600; }
  .flows { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
  .flow { background: var(--chip); border: 1px solid var(--line); border-radius: 16px; padding: 14px; min-width: 0; }
  .flow h3 { margin: 0 0 4px; font-size: 15px; }
  .flow p { margin: 0 0 10px; font-size: 13px; color: var(--fg2); line-height: 1.45; }
  .steps { display:flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .st { font-size: 12px; padding: 4px 9px; border-radius: 8px; border: 1px solid var(--line); }
  .st.new { border-color: var(--pick); color: var(--pick); font-weight: 600; }
  .st.gone { text-decoration: line-through; opacity: .55; }
  .st.acc { background: var(--fg); color: var(--page); border-color: var(--fg); }
  .arrow { color: var(--fg2); font-size: 12px; }
  .grid { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 18px; }
  .shot h4 { margin: 0 0 3px; font-size: 14px; }
  .shot .why { font-size: 12.5px; color: var(--fg2); line-height: 1.45; margin: 0 0 8px; min-height: 36px; }
  .pair { display:flex; gap: 8px; }
  .ph { flex:1; min-width:0; border-radius: 22px; padding: 14px 11px 12px; height: 520px; display:flex; flex-direction: column; gap: 8px; overflow: hidden; position: relative; }
  .light { --g:#DDE0DB; --r:#FFFFFF; --w:#EEF0EC; --i:#111315; --i2:#454A4F; --i3:#53585D; --l:#C3C7C0; --act:#111315; --onact:#FFFFFF; --acc:#2350D8; }
  .dark  { --g:#121416; --r:#282B30; --w:#1D2024; --i:#EEEFEB; --i2:#B5B9B4; --i3:#9A9F9A; --l:#3C4147; --act:#EEEFEB; --onact:#121416; --acc:#8AA8FF; }
  .ph { background: var(--g); color: var(--i); }
  .top { display:flex; align-items:center; gap: 6px; font-size: 10px; color: var(--i2); }
  .dash { flex:1; display:flex; gap: 3px; }
  .dash i { flex:1; height: 3px; border-radius: 2px; background: var(--l); }
  .dash i.on { background: var(--i); }
  .tt { font-size: 18px; font-weight: 700; line-height: 1.2; margin: 4px 1px 0; }
  .sub { font-size: 10.5px; color: var(--i2); line-height: 1.4; margin: 0 1px; }
  .opt { background: var(--r); border-radius: 13px; padding: 9px 10px; font-size: 11.5px; display:flex; justify-content: space-between; align-items: center; gap: 6px; border: 1.5px solid transparent; }
  .opt.sel { border-color: var(--i); }
  .opt .ck { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--l); flex: none; }
  .opt.sel .ck { background: var(--i); border-color: var(--i); }
  .lbl { font-size: 9.5px; color: var(--i2); text-transform: uppercase; letter-spacing: .06em; margin: 4px 2px 0; }
  .seg { display:flex; background: var(--w); border-radius: 11px; padding: 3px; gap: 3px; }
  .seg span { flex:1; text-align:center; font-size: 11px; padding: 6px 0; border-radius: 8px; }
  .seg span.on { background: var(--r); font-weight: 600; }
  .spacer { flex: 1; }
  .btn { min-height: 34px; border-radius: 18px; display:flex; align-items:center; justify-content:center; font-size: 12px; font-weight: 600; padding: 0 10px; text-align: center; }
  .btn.p { background: var(--act); color: var(--onact); }
  .btn.g { background: transparent; color: var(--i); font-weight: 500; }
  .sum { background: var(--r); border-radius: 14px; padding: 10px; display:flex; flex-direction: column; gap: 8px; }
  .sum .it { display:flex; gap: 8px; font-size: 11px; line-height: 1.35; }
  .sum .it b { display:block; font-size: 11.5px; }
  .sum .it .ic { width: 22px; height: 22px; border-radius: 7px; background: var(--w); flex: none; display:flex; align-items:center; justify-content:center; }
  .sum .it .ic svg { width: 13px; height: 13px; stroke: var(--i); fill: none; stroke-width: 1.6; }
  .plan { background: var(--r); border-radius: 13px; padding: 9px 10px; display:flex; flex-direction: column; gap: 2px; border: 1.5px solid transparent; position: relative; }
  .plan.sel { border-color: var(--i); }
  .plan .h { display:flex; justify-content: space-between; font-size: 12px; font-weight: 600; }
  .plan .d { font-size: 10px; color: var(--i2); line-height: 1.35; }
  .plan .tag { position:absolute; top: -8px; left: 10px; font-size: 8.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; background: var(--acc); color: var(--g); padding: 2px 7px; border-radius: 6px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .fine { font-size: 9px; color: var(--i2); line-height: 1.4; margin: 0 2px; }
  .links { display:flex; justify-content: center; gap: 10px; font-size: 9px; color: var(--i2); }
  .links u { text-decoration: underline; }
  .field { background: var(--r); border-radius: 11px; padding: 8px 10px; font-size: 11px; display:flex; justify-content: space-between; align-items: center; }
  .field .ok { font-size: 10px; color: var(--i); font-weight: 600; }
  .note { font-size: 12.5px; color: var(--fg2); line-height: 1.5; max-width: 86ch; }
  .note li { margin-bottom: 5px; }
  .pick { display:inline-block; font-size: 11px; font-weight: 700; color: var(--pick); border: 1px solid var(--pick); border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }
  @media (max-width: 980px) { .grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  @media (max-width: 680px) { .grid, .flows { grid-template-columns: 1fr; } }
</style>

<div class="wrap">
  <h1 data-t="h1"></h1>
  <p class="lead" data-t="lead"></p>
  <div class="bar" role="group" aria-label="Idioma">
    <button type="button" data-lang="pt" aria-pressed="true">Português (Brasil, R$)</button>

  <ul class="note" id="rules"></ul>
</div>

function steps(L, b) {
  const s = T[L].steps;
  const parts = b
    ? [[s[0]],[s[1]],[s[2],'gone'],[s[3]],[s[4],'new'],[s[5],'new'],[s[6]],[s[7]],[s[8]],[s[9]],[s[10],'new'],[s[11],'acc'],[s[12],'new']]
    : [[s[0]],[s[1]],[s[2]],[s[3]],[s[4],'new'],[s[5],'new'],[s[6]],[s[7]],[s[8]],[s[9]],[s[10],'new'],[s[11],'acc'],[s[12],'new']];
  return parts.map(([n,c],i)=>`<span class="st ${c||''}">${n}</span>${i<parts.length-1?'<span class="arrow">›</span>':''}`).join('');
}
function top(n, of) { return `<div class="top"><span>‹</span><div class="dash">${Array.from({length:of},(_,i)=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div></div>`; }
function opts(list, sel) { return list.map((o,i)=>`<div class="opt ${sel.includes(i)?'sel':''}"><span>${o}</span><span class="ck"></span></div>`).join(''); }
function screens(L) {
  const t = T[L];
  const s1 = `${top(3,9)}<div class="tt">${t.q1t}</div><div class="sub">${t.q1s}</div>${opts(t.q1o,[0,2])}<div class="lbl">${t.q1n}</div><div class="seg">${t.q1seg.map((x,i)=>`<span class="${i===1?'on':''}">${x}</span>`).join('')}</div><div class="spacer"></div><div class="btn p">${t.cont}</div>`;
  const s2 = `${top(4,9)}<div class="tt">${t.q2t}</div><div class="sub">${t.q2s}</div>${opts(t.q2o,[0,1])}<div class="spacer"></div><div class="btn p">${t.cont}</div>`;
  const s3 = `${top(8,9)}<div class="tt">${t.r_t}</div><div class="sub">${t.r_s}</div><div class="sum">${[[ICON.syr,t.r1],[ICON.bell,t.r2],[ICON.lab,t.r3]].map(([ic,[a,b]])=>`<div class="it"><span class="ic">${ic}</span><span><b>${a}</b>${b}</span></div>`).join('')}</div><div class="spacer"></div><div class="btn p">${t.r_btn}</div><div class="btn g">${t.r_have}</div>`;
  const offer = (eligible, code) => {
    const p3 = eligible ? t.o3 : t.n3;
    return `<div class="tt">${eligible?t.o_t:t.n_t}</div><div class="sub">${eligible?t.o_s:t.n_s}</div>
    <div class="plan sel" style="margin-top:8px">${eligible?`<span class="tag">${t.o_tag}</span>`:''}<div class="h"><span>${p3[0]}</span><span class="mono">${p3[1]}</span></div><div class="d">${p3[2]}</div></div>
    <div class="plan"><div class="h"><span>${t.oa[0]}</span><span class="mono">${t.oa[1]}</span></div><div class="d">${t.oa[2]}</div></div>
    <div class="fine" style="text-align:center;text-decoration:underline">${t.oall}</div>
    ${code?`<div class="field"><span class="mono">${t.c_field}</span><span class="ok">${t.c_ok}</span></div><div class="fine">${t.c_line}</div>`:`<div class="fine" style="text-align:center">${t.o_code} ›</div>`}
    <div class="spacer"></div>
    <div class="fine">${eligible?t.o_fine:t.n_fine}</div>
    <div class="btn p">${eligible?t.o_btn:t.n_btn}</div>
    <div class="btn g">${t.o_free}</div>
    ${code?'':`<div class="fine" style="text-align:center">${t.o_free_d}</div>`}
    <div class="links">${t.links.map(x=>`<u>${x}</u>`).join('')}</div>`;
  };
  return [[t.s1,s1],[t.s2,s2],[t.s3,s3],[t.s4,offer(true,false)],[t.s5,offer(false,false)],[t.s6,offer(true,true)]];
}
function render(L) {
  document.documentElement.lang = L === 'pt' ? 'pt-BR' : 'en';
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T[L][el.dataset.t]; });
  document.getElementById('flowA').innerHTML = steps(L, false);
  document.getElementById('flowB').innerHTML = steps(L, true);
  document.getElementById('grid').innerHTML = screens(L).map(([[h,w],body]) =>
    `<div class="shot"><h4>${h}</h4><p class="why">${w}</p><div class="pair"><div class="ph light">${body}</div><div class="ph dark">${body}</div></div></div>`).join('');
  document.getElementById('rules').innerHTML = T[L].rules.map(r=>`<li>${r}</li>`).join('');
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === L)));
}
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => render(b.dataset.lang)));
render('pt');
</script>
