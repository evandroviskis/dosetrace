name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # The sync harness needs better-sqlite3 (native, prebuilt binary), so we
      # install deps. Everything else in the suite is pure JS.
      - run: npm ci
      - run: npm test
