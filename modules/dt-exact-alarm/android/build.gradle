plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'io.outcom.dosetrace'
version = '1.0.0'

android {
  namespace "expo.modules.dtexactalarm"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // A-111: RefreshOnUpdateReceiver enqueues expo-background-task's worker (same WorkManager version).
  implementation 'androidx.work:work-runtime-ktx:2.9.1'
}
