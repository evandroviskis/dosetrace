<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>DoseTrace Admin</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0C1B2E; --surface:#12263C; --surface2:#183454; --line:#22405f;
    --ink:#EAF2FB; --muted:#8FA6BD; --accent:#4FA3E8; --accent2:#46C6EE;
    --good:#2CD3A7; --warn:#E8B54F; --bad:#E8776B;
    --navbg:rgba(12,27,46,.92); --accent-ink:#04121f; --scrim:rgba(4,10,18,.6);
    --qrbg:#FFFFFF;
  }
  :root[data-theme="light"]{
    --bg:#EEF3F9; --surface:#FFFFFF; --surface2:#F1F5FA; --line:#D6E0EC;
    --ink:#0C2340; --muted:#5A7085; --accent:#2A78C2; --accent2:#2AA0C8;
    --good:#159A78; --warn:#B5831C; --bad:#CC4B3D;
    --navbg:rgba(238,243,249,.92); --accent-ink:#FFFFFF; --scrim:rgba(12,27,46,.45);
    --qrbg:#FFFFFF;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--accent)}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 20px 80px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.01em}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .meta{color:var(--muted);font-size:12.5px}
  button{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:7px 13px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
  button.icon{padding:7px 11px;font-size:15px;line-height:1}
  select{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;cursor:pointer}
  nav.sections{position:sticky;top:0;z-index:40;background:var(--navbg);backdrop-filter:blur(6px);display:flex;gap:6px;flex-wrap:wrap;padding:10px 0;margin:6px 0 4px;border-bottom:1px solid var(--line)}
  nav.sections a{color:var(--muted);text-decoration:none;font-weight:600;font-size:13.5px;padding:6px 11px;border-radius:8px}
  nav.sections a.active,nav.sections a:hover{color:var(--ink);background:var(--surface)}
  section{padding-top:22px;margin-top:8px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px;font-weight:700;display:flex;align-items:center;gap:8px}
  h3{font-size:13.5px;margin:0 0 10px;color:var(--ink);font-weight:700}
  .grid{display:grid;gap:12px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .two{grid-template-columns:1fr 1fr}.three{grid-template-columns:1fr 1fr 1fr}
  @media(max-width:820px){.two,.three{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
  .kpi .label{color:var(--muted);font-size:12px;font-weight:600}
  .kpi .val{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
  .kpi .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .row{display:flex;align-items:center;gap:10px;margin:7px 0}
  .row .k{width:160px;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .track{flex:1;background:var(--surface2);border-radius:6px;height:15px;overflow:hidden}
  .row .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .row .n{width:52px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  table.cmp{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  table.cmp th,table.cmp td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);font-size:13.5px}
  table.cmp th:first-child,table.cmp td:first-child{text-align:left;color:var(--muted);font-weight:600}
  table.cmp th{color:var(--muted);font-weight:600;font-size:12px}
  .delta{font-size:11.5px;font-weight:700;margin-left:6px}
  .up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--muted)}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
  .pill.ok{background:rgba(44,211,167,.15);color:var(--good)}
  .pill.off{background:rgba(143,166,189,.15);color:var(--muted)}
  .pill.err{background:rgba(232,119,107,.15);color:var(--bad)}
  .muted{color:var(--muted)}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 11px;font-size:12.5px;font-weight:600}
  .chip button{padding:0 6px;background:none;border:none;color:var(--muted);font-size:14px;line-height:1}
  .chip button:hover{color:var(--bad)}
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;position:sticky;top:48px;z-index:30}
  input[type=date]{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
  canvas{max-width:100%}
  .info{width:16px;height:16px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);color:var(--muted);font-size:10px;font-weight:800;cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center;line-height:1}
  .info:hover{color:var(--ink);border-color:var(--accent)}
  .heat td{padding:6px 8px;text-align:center;border-radius:6px;font-variant-numeric:tabular-nums;font-size:12.5px}
  .center{min-height:60vh;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted)}
  code{background:var(--surface2);padding:1px 6px;border-radius:5px;font-size:12.5px}
  #gloss{position:fixed;inset:0;background:var(--scrim);display:none;align-items:center;justify-content:center;z-index:80;padding:20px}
  #gloss .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:460px;width:100%;max-height:85vh;overflow-y:auto;padding:20px 22px}
  #gloss .defs h5{margin:14px 0 0;font-size:14px;color:var(--ink)}
  #gloss .defs:first-child h5{margin-top:4px}
  #gloss .defs dl{margin:0}
  #gloss .defs dt{margin-top:10px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  #gloss .defs dd{margin:2px 0 0;color:var(--ink);line-height:1.5}
  .srcrow{margin:-4px 0 10px}
  .kpi .srcrow{margin:8px 0 0}
  .src{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;font-size:11px;font-weight:600;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px}
  .src:hover{color:var(--ink);border-color:var(--accent)}
  .src .ids{color:var(--accent);font-variant-numeric:tabular-nums}
  .tscroll{overflow-x:auto}
  .tabs{display:flex;gap:6px;margin:4px 0 2px}
  .tabs button{font-weight:700}
  .winsel{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
  .winsel .range{color:var(--muted);font-size:12.5px}
  .kpi .plat{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
  .dot-ios,.dot-android,.dot-unknown{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .dot-ios{background:var(--accent)}.dot-android{background:var(--good)}.dot-unknown{background:var(--muted)}
  .nm{color:var(--warn);font-weight:700}
  .nmwhy{color:var(--muted);font-size:12.5px}
  table.mv{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  table.mv th,table.mv td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:13.5px;text-align:right;vertical-align:middle}
  table.mv th:first-child,table.mv td:first-child,table.mv th:nth-child(2),table.mv td:nth-child(2){text-align:left}
  table.mv th{color:var(--muted);font-weight:600;font-size:12px}
  table.mv td.id{color:var(--accent);font-weight:800;width:44px;text-align:left}
  table.mv tr.sub td{color:var(--muted)}
  table.mv tr.sub td:nth-child(2){padding-left:24px}
  .bar{display:inline-block;width:90px;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:8px}
  .bar span{display:block;height:100%;background:var(--accent)}
  .check-ok{color:var(--good);font-weight:700}.check-bad{color:var(--bad);font-weight:700}
  .qsub{color:var(--muted);font-size:12.5px;margin:-6px 0 8px}
  table.g2 td{text-align:center;padding:6px 8px;border-radius:6px;font-size:12.5px}
  .accbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
  .accbar input[type=search]{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:220px}
  .accbar .sel{color:var(--muted);font-size:12.5px}
  .accbar label{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:12.5px}
  .accbar label select{padding:5px 8px;font-size:13px}
  table.cmp th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
  table.cmp th.sortable:hover{color:var(--ink)}
  table.cmp th.sorted{color:var(--accent)}
  table.cmp td.chk,table.cmp th.chk{width:28px;text-align:center}
  #gloss ul.emails{margin:8px 0 0;padding-left:18px;max-height:40vh;overflow:auto;color:var(--ink);font-size:12.5px}
  #gloss .actions{display:flex;gap:8px;margin-top:14px}
  .msg{margin:0 0 10px;font-size:13px}
  .msg.ok{color:var(--good)}.msg.err{color:var(--bad)}
  ul.rules{margin:0;padding-left:18px;color:var(--ink)}
  ul.rules li{margin:5px 0}
  table.ds{width:100%;border-collapse:collapse}
  table.ds th,table.ds td{padding:9px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);font-size:13px}
  table.ds th{color:var(--muted);font-weight:600;font-size:12px}
  table.ds td.c-id{font-weight:800;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
  table.ds td.c-name{font-weight:600}
  table.ds td.c-src,table.ds td.c-range{color:var(--muted)}
  @media(max-width:640px){
    table.ds thead{display:none}
    table.ds,table.ds tbody,table.ds tr,table.ds td{display:block;width:100%}
    table.ds tr{padding:10px 0;border-bottom:1px solid var(--line)}
    table.ds td{border:none;padding:3px 0}
    table.ds td::before{content:attr(data-l);display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  }
  #gloss h4{margin:0 0 8px;font-size:16px}
  #gloss p{margin:0;color:var(--muted);line-height:1.55}
  #gloss button{margin-top:16px}
  /* [login-css-start] */
  /* 3.1 login screens and the step-up dialog (picture docs/design/adm-31-login.html). Tokens only. */
  .lcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 18px;max-width:380px;margin:34px auto 0}
  .lcard h4,.ldlg h4{margin:0 0 4px;font-size:18px;letter-spacing:-.01em}
  .lcard .lsub,.ldlg .lsub{color:var(--muted);font-size:13px;margin:0 0 16px}
  .lsteps{display:flex;gap:6px;margin:0 0 14px}
  .lsteps span{flex:1;height:4px;border-radius:2px;background:var(--surface2)}
  .lsteps span.on{background:var(--accent)}
  .lfld{margin:0 0 12px}
  .lfld label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px}
  .linp{display:block;width:100%;font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:8px 11px;min-height:38px}
  .linp::placeholder{color:var(--muted);opacity:1}
  .linp:focus{outline:none;border-color:var(--accent)}
  .linp.errb{border-color:var(--bad)}
  .linp.code{font-size:22px;letter-spacing:.42em;text-indent:.42em;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
  .lbtn{display:block;width:100%;font:inherit;font-weight:700;text-align:center;border-radius:9px;padding:9px 13px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);margin-top:4px}
  .lbtn.sec{background:var(--surface2);border-color:var(--line);color:var(--ink);font-weight:600}
  .lbtn:disabled{opacity:.6;cursor:default}
  .lbtns{display:flex;gap:8px;margin-top:6px}
  .lbtns .lbtn{margin-top:0}
  .llink{display:block;width:100%;text-align:center;margin-top:12px;font-size:13px;color:var(--accent);background:none;border:none;padding:4px}
  .llink:hover{text-decoration:underline}
  .lfine{color:var(--muted);font-size:12px;margin:12px 0 0;text-align:center}
  .lmsg{font-size:13px;margin:0 0 12px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface2)}
  .lmsg.err{color:var(--bad)}
  .lwho{font-size:13px;color:var(--muted);margin:0 0 14px;overflow-wrap:anywhere}
  .lwho b{color:var(--ink);font-weight:600}
  .lqr{display:flex;flex-direction:column;gap:12px;align-items:center;margin:0 0 14px}
  .lqr .qrw{flex:none;display:block;width:232px;height:232px;max-width:100%;background:var(--qrbg);border:1px solid var(--line);border-radius:8px;padding:6px}
  .lqr .qrw img{display:block;width:100%;height:100%}
  .lqr .key{font-size:12px;color:var(--muted);min-width:0;align-self:stretch;text-align:center}
  .lqr .key code{display:block;margin-top:4px;color:var(--ink);font-size:12.5px;background:var(--surface2);border-radius:5px;padding:3px 6px;letter-spacing:.05em;overflow-wrap:anywhere}
  #stepup{position:fixed;inset:0;background:var(--scrim);display:none;align-items:center;justify-content:center;z-index:90;padding:16px}
  #stepup .ldlg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;max-width:380px;width:100%}
  #stepup .ldlg h4{font-size:16px;margin-bottom:6px}
  #stepup .ldlg .lsub{margin-bottom:14px}
  @media(max-width:480px){.lcard{padding:18px 16px 16px;margin-top:22px}}
  /* [login-css-end] */
  /* [premium-css-start] */
  /* 3.2 Premium dialog (docs/specs/admin-panel.md Phase 3 › 3.2). Tokens only, both themes. */
  #prem{position:fixed;inset:0;background:var(--scrim);display:none;align-items:flex-start;justify-content:center;z-index:85;padding:24px 16px;overflow-y:auto}
  #prem .pdlg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;max-width:520px;width:100%;margin:auto 0}
  #prem h4{margin:0 0 12px;font-size:16px;letter-spacing:-.01em}
  .pm-eyebrow{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .pm-email{font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--ink);overflow-wrap:anywhere;margin-top:2px}
  .pm-meta{color:var(--muted);font-size:12.5px;margin-top:2px}
  .pm-kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:14px 0;font-size:13.5px}
  .pm-kv dt{color:var(--muted);font-weight:600}
  .pm-kv dd{margin:0;color:var(--ink);overflow-wrap:anywhere}
  .pm-local{display:block;color:var(--muted);font-size:12.5px}
  .pm-lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px}
  .pm-seg,.pm-pills{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
  .pm-seg button,.pm-pills button{padding:6px 11px;font-size:13px}
  .pm-seg button:disabled,.pm-pills button:disabled{opacity:.45;cursor:default;border-color:var(--line)}
  .pm-why{font-size:12.5px;color:var(--muted);margin:-6px 0 12px;overflow-wrap:anywhere}
  .pm-hint{font-size:12px;color:var(--muted);margin:5px 0 0}
  .pm-note{font-size:12.5px;color:var(--ink);margin:0 0 10px;padding:8px 10px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;background:var(--surface2)}
  .pm-note.warn{border-left-color:var(--warn)}
  .pm-ok{font-size:14px;font-weight:700;color:var(--ink);margin:12px 0;padding:8px 10px;border-left:3px solid var(--good);background:var(--surface2);border-radius:9px}
  .pm-cust{border:1px solid var(--accent);border-radius:11px;padding:12px;margin:12px 0;background:var(--surface2)}
  .pm-cust p{margin:6px 0 10px;color:var(--ink);overflow-wrap:anywhere}
  @media(max-width:480px){#prem{padding:12px}#prem .pdlg{padding:16px}.pm-kv{grid-template-columns:1fr;gap:2px 0}.pm-kv dd{margin-bottom:6px}}
  /* [premium-css-end] */
  /* [messages-css-start] */
  /* A-163 Mensagem dialog (dosetrace docs/specs/team-messages.md TM-1..TM-10). Tokens only, both themes. */
  #msg{position:fixed;inset:0;background:var(--scrim);display:none;align-items:flex-start;justify-content:center;z-index:85;padding:24px 16px;overflow-y:auto}
  #msg .pdlg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;max-width:520px;width:100%;margin:auto 0;overflow-wrap:anywhere}
  #msg h4{margin:0 0 12px;font-size:16px;letter-spacing:-.01em}
  #msg .pm-kv.tight{margin:0 0 12px}
  .ms-ta{min-height:92px;resize:vertical;line-height:1.45}
  .ms-cnt{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:5px}
  .ms-cnt .pm-hint{margin:0}
  .ms-num{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .ms-num.over{color:var(--bad);font-weight:700}
  .ms-npv{display:flex;gap:10px;align-items:flex-start;background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin:0 0 10px}
  .ms-npv img{border-radius:7px;flex:none}
  .ms-npt{flex:1;min-width:0;font-size:13.5px;line-height:1.4}
  .ms-nph{display:flex;justify-content:space-between;gap:8px}
  .ms-nph span{color:var(--muted);font-size:12px;flex:none}
  .ms-npb{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
  .ms-npe{color:var(--muted)}
  .pm-ok.ms-none{border-left-color:var(--accent);font-weight:600}
  .ms-hist{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
  .ms-hrow{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
  .ms-hrow:last-child{border-bottom:0}
  .ms-hmain{flex:1;min-width:0}
  .ms-hdate{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .ms-htext{font-size:13px;color:var(--ink);white-space:pre-line}
  .ms-hrow.wd .ms-htext{color:var(--muted);text-decoration:line-through}
  .ms-hst{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none;max-width:40%}
  .ms-hsub{font-size:11.5px;color:var(--muted);text-align:right}
  .ms-wd{padding:3px 9px;font-size:12px;margin-top:4px}
  .ms-wdq{margin:4px 0 8px;padding:8px 10px;border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:9px;background:var(--surface2);font-size:12.5px;color:var(--ink)}
  .ms-wdq .lbtns{margin-top:8px}
  .ms-wdq .lbtn{padding:6px 10px;font-size:13px}
  .ms-hint-block{margin-top:12px}
  .ms-pvnote{margin:-4px 0 12px}
  .ms-foot{margin-top:14px}
  .ms-orig{margin:0 0 12px;padding:8px 10px;border:1px dashed var(--line);border-radius:9px;background:var(--surface2)}
  .ms-orig .pm-lbl{margin-bottom:3px}
  .ms-orig p{margin:0;font-size:13px;color:var(--muted);white-space:pre-line}
  @media(max-width:480px){#msg{padding:12px}#msg .pdlg{padding:16px}.ms-hrow{flex-direction:column;gap:4px}.ms-hst{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px;max-width:none}.ms-hsub{text-align:left}.ms-cnt{flex-direction:column;gap:2px}}
  /* [messages-css-end] */
  /* [users-css-start] */
  /* 3.3 Users tab: the Contas list, the selected account's card beside it (full screen below 1000 px) and its
     single Opções menu (founder 2026-10-22). Tokens only, both themes. */
  .acc-split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
  .acc-list{min-width:0}
  .acc-card{position:sticky;top:58px;max-height:calc(100vh - 72px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;overflow-wrap:anywhere}
  .us-empty{color:var(--muted);font-size:13px;text-align:center;padding:30px 8px}
  .us-empty h4{margin:0 0 6px;font-size:14px;color:var(--ink)}
  table.acc tr.acc-row{cursor:pointer}
  table.acc tr.acc-row:hover td{background:var(--surface2)}
  table.acc tr.acc-row.sel td{background:var(--surface2)}
  table.acc tr.acc-row.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
  table.acc tr.acc-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  table.acc th,table.acc td{white-space:nowrap}
  table.acc td.em{text-align:left;max-width:220px;overflow:hidden;text-overflow:ellipsis}
  .acc-list .accbar input[type=search]{min-width:410px}
  .acc-card .pm-email{font-size:17px}
  .acc-card .pm-kv{grid-template-columns:1fr;gap:1px 0}
  .acc-card .pm-kv dd{margin-bottom:8px}
  .us-top{display:none;margin:0 0 12px}
  .us-back{padding:6px 12px;font-size:13px}
  .us-head{margin:0 0 4px}
  .us-who{min-width:0}
  .us-opt{position:relative;margin:12px 0 2px}
  .us-optbtn{margin:0}
  .us-menu{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 12px 32px var(--scrim)}
  .us-menu button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;font-size:13.5px;color:var(--ink)}
  .us-menu button:hover:not(:disabled),.us-menu button:focus-visible{background:var(--surface2);outline:none}
  .us-menu button:disabled{color:var(--muted);cursor:default}
  .us-mnote{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
  .us-sep{height:1px;background:var(--line);margin:4px 6px}
  .us-hrow{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
  .us-hrow:last-child{border-bottom:0}
  .us-hd{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;flex:none}
  .us-hl{flex:1;min-width:0}
  #rsd{position:fixed;inset:0;background:var(--scrim);display:none;align-items:flex-start;justify-content:center;z-index:85;padding:24px 16px;overflow-y:auto}
  #rsd .pdlg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;max-width:460px;width:100%;margin:auto 0;overflow-wrap:anywhere}
  #rsd h4{margin:0 0 10px;font-size:16px}
  #rsd .pm-email{margin:0 0 12px}
  .acc-strip{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
  .acc-strip .sb{flex:1 1 auto;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
  .acc-strip .sl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .acc-strip .sv{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin-top:3px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .acc-strip .sv b{color:var(--ink);font-weight:700}
  .acc-strip .sv .it{white-space:nowrap}
  .acc-strip .sv b.big{font-size:20px;font-weight:800;line-height:1.1}
  .acc-strip .sb.note{background:transparent;border-style:dashed;display:flex;align-items:center}
  .acc-strip .sb.note .sv{margin:0;font-size:12.5px}
  @media(max-width:999px){
    .acc-split{grid-template-columns:1fr}
    .acc-card{display:none}
    .acc-card.open{display:block;position:fixed;inset:0;z-index:70;max-height:none;border:0;border-radius:0;background:var(--bg);padding:16px}
    .us-top{display:block}
  }
  @media(max-width:640px){
    table.acc,table.acc tbody,table.acc tr,table.acc td{display:block;width:100%}
    table.acc tr.acc-hdr{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 8px;border-bottom:1px solid var(--line)}
    table.acc tr.acc-hdr th{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:11.5px}
    table.acc tr.acc-hdr th.chk,table.acc tr.acc-hdr th.nolab{display:none}
    table.acc tr.acc-row{position:relative;padding:10px 0 10px 34px;border-bottom:1px solid var(--line)}
    table.acc tr.acc-row td{border:0;padding:1px 0;text-align:left;font-size:12.5px;color:var(--muted)}
    table.acc tr.acc-row td.em{max-width:none;white-space:normal;overflow-wrap:anywhere;font-size:14px;color:var(--ink);font-weight:600}
    table.acc tr.acc-row td.chk{position:absolute;left:4px;top:10px;width:auto}
    table.acc tr.acc-row td[data-l]::before{content:attr(data-l) ": ";font-weight:600}
    .acc-list .accbar input[type=search]{min-width:0;width:100%}
    .acc-strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
    .acc-strip .sb{order:2}.acc-strip .sb.main{order:0}.acc-strip .sb.note{order:1}
    #rsd{padding:12px}#rsd .pdlg{padding:16px}
  }
  /* [users-css-end] */

  // ---- date helpers ----
  // Server dates are UTC 'YYYY-MM-DD'. utcDay(0) = today (UTC), utcDay(6) = six days ago.
  function utcDay(back){return new Date(Date.now()-back*864e5).toISOString().slice(0,10);}
  function pd(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
  function inR(dateStr,start,end){var d=pd(dateStr);return d>=start&&d<end;}
  function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);x.setHours(0,0,0,0);return x;}
  function monMid(d){var x=new Date(d);x.setHours(0,0,0,0);var day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x;}
  function monthStart(d){return new Date(d.getFullYear(),d.getMonth(),1);}
  function fmtD(d){try{return d.toLocaleDateString(LANG,{month:'short',day:'numeric'});}catch(e){return (d.getMonth()+1)+'/'+d.getDate();}}
  function fmtMY(d){try{return d.toLocaleDateString(LANG,{month:'short',year:'numeric'});}catch(e){return (d.getMonth()+1)+'/'+d.getFullYear();}}
  function periodFor(gran,anchor){
    var a=new Date(anchor);a.setHours(0,0,0,0);
    if(gran==='day')return {label:fmtD(a),start:a,end:addDays(a,1)};
    if(gran==='week'){var s=monMid(a);return {label:t('wk')+' '+fmtD(s),start:s,end:addDays(s,7)};}
    var s2=monthStart(a);return {label:fmtMY(s2),start:s2,end:new Date(s2.getFullYear(),s2.getMonth()+1,1)};
  }
  function presets(gran){
    var now=pd(utcDay(0));
    if(gran==='day')return [periodFor('day',now),periodFor('day',addDays(now,-1))];
    if(gran==='week')return [periodFor('week',now),periodFor('week',addDays(now,-7))];
    return [periodFor('month',now),periodFor('month',new Date(now.getFullYear(),now.getMonth()-1,1))];
  }

  window.markTests=function(mark){

      document.getElementById('gloss').style.display='none';

      function send(retried){
        AUTH.api('POST',body).then(function(x){
          if(x.expired){showExpired();return;}
          if(x.noauth){showNoauth();return;}
          if(x.stepUp){if(retried){MSG={ok:false,text:t('write_err',{m:t('li_err_code')})};render();return;}openStepUp(function(){send(true);});return;}
          if(x.status===200&&x.j){MSG={ok:true,text:t('write_ok',{n:x.j.changed})};SEL={};render();load();return;}
          MSG={ok:false,text:t('write_err',{m:(x.j&&x.j.error)||(x.status?String(x.status):t('li_err_conn'))})};render();
        });
      }
      if(AUTH.needsStepUp())openStepUp(function(){send(true);});else send(false);
    };
  };

  // (the plan, 3.2 reader) in parallel; every action reuses an existing dialog (Premium 3.2, Mensagem A-163,
  // the test-marking confirm) or the resend dialog below.
  var US=null, RS=null;
  function usEmailOf(id){var AL=D.accounts_list||{},e=null;(AL.rows||[]).concat(AL.tests||[]).forEach(function(r){if(r.id===id)e=String(r.email).toLowerCase();});return e;}

  // keep=true: refresh under the open card (after a Premium change, a message, a resend or a test marking).
  function usLoad(keep){
    if(!US)return;
    var id=US.id;
    if(!keep){US.phase='loading';US.err=null;}
    Promise.all([AUTH.api('GET',null,'/api/adm-account?user_id='+encodeURIComponent(id)),AUTH.api('GET',null,'/api/adm-premium?user_id='+encodeURIComponent(id))]).then(function(r){
      if(!US||US.id!==id)return;
      var a=r[0],p=r[1];
      if(a.expired||p.expired){US=null;showExpired();return;}
      if(a.noauth||p.noauth){US=null;showNoauth();return;}
      if(a.status===200&&a.j&&a.j.card){
        US.user=a.j.user;US.card=a.j.card;US.links=a.j.links;US.phase='ok';
        US.isTest=['list','domain','rule'].indexOf(a.j.card.test_kind)>=0;
      } else if(!keep){US.phase='error';US.err={status:a.status||0,code:a.j&&a.j.code};}
      if(p.status===200&&p.j&&p.j.plan){US.plan=p.j.plan;US.rc=p.j.rc;}
      else {US.plan=null;US.rc=(p.j&&p.j.code)||('http '+(p.status||0));}
      render();
    });
  }

  // A double-click sends one request: clicks while one is in flight are dropped.
  function msgSender(fn){var busy=false;return function(b){if(busy)return Promise.resolve(null);busy=true;return Promise.resolve(fn(b)).then(function(r){busy=false;return r;},function(e){busy=false;throw e;});};}
  // [msg-pure-end]
  var MS=null;
  var MSG_SEND=msgSender(function(o){return AUTH.api('POST',o.body,o.path);});
  function msgEl(){return document.getElementById('msg');}
  function renderMsg(){var box=document.getElementById('msg-box');if(!MS||!box)return;MS.lang=LANG;box.innerHTML=msgDialogHtml(MS,t,esc);}
  function closeMsg(){var sent=!!(MS&&MS.result),id=MS&&MS.user&&MS.user.id;MS=null;var el=msgEl();if(el)el.style.display='none';if(sent&&US&&US.id===id)usLoad(true);}
  window.openMessage=function(id){
    MS={phase:'loading',user:{id:id,short:String(id).slice(0,8),email:null},info:null,text:'',busy:false,rid:null,body:null,result:null,err:null,wd:null,wdDone:false,wdErr:null,lang:LANG};
    msgEl().style.display='flex';msgLoad(false);
  };
  // keep=true: refresh the account and its history under a send / withdraw result without leaving it.
  function msgLoad(keep){
    if(!MS)return;
    var id=MS.user.id;
    if(!keep){MS.phase='loading';MS.err=null;renderMsg();}
    AUTH.api('GET',null,'/api/adm-messages?user_id='+encodeURIComponent(id)).then(function(x){
      if(!MS||MS.user.id!==id)return;
      if(x.expired){closeMsg();showExpired();return;}
      if(x.noauth){closeMsg();showNoauth();return;}
      if(x.status===200&&x.j&&x.j.user){MS.user=x.j.user;MS.info={language:x.j.language,title:x.j.title,silent:x.j.silent,devices:x.j.devices,history:x.j.history||[]};if(!keep)MS.phase='form';renderMsg();return;}
      if(keep)return;
      MS.phase='error';MS.err={status:x.status||0,code:x.j&&x.j.code};renderMsg();
    });
  }
  // TM-3 / TM-4: one request per typed text; a change needs a TOTP check within 15 min — asked before
  // sending, and once more if the server still answers step_up_required (same request_id).
  function msgSend(){
    if(!MS||!msgCanSend(MS))return;
    if(msgNeedsTr(MS)){msgTranslate();return;}
    MS.rid=MS.rid||premUuid();
    if(!MS.body)MS.body={request_id:MS.rid,action:'send',user_id:MS.user.id,text:msgSendText(MS).trim(),translated:!!(MS.tr&&MS.tr.phase==='review')};
    var body=MS.body,id=MS.user.id;
    MS.busy=true;MS.err=null;renderMsg();
    function go(retried){
      MSG_SEND({body:body,path:'/api/adm-messages'}).then(function(x){
        if(x===null||!MS||MS.user.id!==id)return;
        if(x.expired){closeMsg();showExpired();return;}
        if(x.noauth){closeMsg();showNoauth();return;}
        if(x.stepUp){if(retried){MS.busy=false;MS.err={status:401,code:null};renderMsg();return;}openStepUp(function(){go(true);});return;}
        MS.busy=false;
        if(x.status===200&&x.j&&x.j.ok){MS.phase='done';MS.result=x.j;MS.wd=null;MS.wdDone=false;MS.wdErr=null;renderMsg();msgLoad(true);return;}
        MS.err={status:x.status||0,code:x.j&&x.j.code,retry_after:x.j&&x.j.retry_after};renderMsg();
      });
    }
    if(AUTH.needsStepUp())openStepUp(function(){go(true);});else go(false);
  }
  // TM-25: ask the server (same write gate) for a translation into the account's app language. Same language →
  // sent as typed; a translation → the review; no key / AI error / limit → say so, offer the original or cancel.
  function msgTranslate(){
    if(!MS||MS.busy)return;
    var id=MS.user.id,text=String(MS.text).trim();
    MS.tr={phase:'checking'};MS.err=null;renderMsg();
    function go(retried){
      MSG_SEND({body:{action:'translate',user_id:id,text:text},path:'/api/adm-messages'}).then(function(x){
        if(x===null||!MS||MS.user.id!==id||!MS.tr||MS.tr.phase!=='checking')return;
        if(x.expired){closeMsg();showExpired();return;}
        if(x.noauth){closeMsg();showNoauth();return;}
        if(x.stepUp){if(retried){MS.tr={phase:'error',code:'translate_failed'};renderMsg();return;}openStepUp(function(){go(true);});return;}
        if(x.status===200&&x.j&&x.j.ok&&x.j.same){MS.tr={phase:'same'};MS.rid=null;MS.body=null;msgSend();return;}
        if(x.status===200&&x.j&&x.j.ok&&x.j.text){MS.tr={phase:'review',text:x.j.text,source:x.j.source,target:x.j.target,orig:text};MS.rid=null;MS.body=null;renderMsg();return;}
        MS.tr={phase:'error',code:(x.j&&x.j.code)||'translate_failed'};renderMsg();
      });
    }
    if(AUTH.needsStepUp())openStepUp(function(){go(true);});else go(false);
  }
  // TM-9: withdraw an unread message (asked first in the history row); same gate and replay rule.
  function msgWithdraw(){
    if(!MS||!MS.wd||MS.wd.busy)return;
    MS.wd.rid=MS.wd.rid||premUuid();
    var body={request_id:MS.wd.rid,action:'withdraw',user_id:MS.user.id,message_id:MS.wd.id},id=MS.user.id;
    MS.wd.busy=true;MS.wdErr=null;MS.wdDone=false;renderMsg();
    function go(retried){
      MSG_SEND({body:body,path:'/api/adm-messages'}).then(function(x){
        if(x===null||!MS||MS.user.id!==id)return;
        if(x.expired){closeMsg();showExpired();return;}
        if(x.noauth){closeMsg();showNoauth();return;}
        if(x.stepUp){if(retried){MS.wd=null;MS.wdErr={status:401,code:null};renderMsg();return;}openStepUp(function(){go(true);});return;}
        MS.wd=null;
        if(x.status===200&&x.j&&x.j.ok){MS.wdDone=true;((MS.info&&MS.info.history)||[]).forEach(function(m){if(m.id===body.message_id)m.withdrawn_at=x.j.withdrawn_at;});renderMsg();msgLoad(true);return;}
        MS.wdErr={status:x.status||0,code:x.j&&x.j.code,retry_after:x.j&&x.j.retry_after};renderMsg();msgLoad(true);
      });
    }
    if(AUTH.needsStepUp())openStepUp(function(){go(true);});else go(false);
  }
  msgEl().addEventListener('click',function(ev){
    var b=ev.target.closest?ev.target.closest('button'):null;
    if(!b||!MS||b.disabled)return;
    var a=b.getAttribute('data-ms');
    if(a==='close'){if(!MS.busy&&!(MS.wd&&MS.wd.busy))closeMsg();return;}
    if(a==='reload'){msgLoad(false);return;}
    if(a==='go'){msgSend();return;}
    if(a==='wd'){MS.wd={id:b.getAttribute('data-wd'),busy:false,rid:null};MS.wdErr=null;MS.wdDone=false;renderMsg();return;}
    if(a==='wd-cancel'){if(MS.wd&&!MS.wd.busy){MS.wd=null;renderMsg();}return;}
    if(a==='wd-go'){msgWithdraw();return;}
    if(a==='tr-back'){if(!MS.busy){MS.tr=null;MS.rid=null;MS.body=null;renderMsg();}return;}
    if(a==='tr-orig'){MS.tr={phase:'orig'};MS.rid=null;MS.body=null;msgSend();}
  });

  function qrSrc(q){q=String(q||'');var pre='data:image/svg+xml;utf-8,';if(q.indexOf(pre)===0)q=q.slice(pre.length);return /^\s*(<\?xml[^>]*>\s*)?(<!--[\s\S]*?-->\s*)*<svg[\s>]/i.test(q)?pre+encodeURIComponent(q):'';}

      var qr=LI.qr?'<div class="lqr"><span class="qrw"><img alt="'+esc(t('li_qr_alt'))+'" src="'+esc(qrSrc(LI.qr))+'"></span><div class="key">'+esc(t('li_enrol_key'))+'<code>'+esc(groupKey(LI.secret))+'</code></div></div>'
        :(LI.error?'':'<p class="lsub">'+esc(t('loading'))+'</p>');
      c='<form class="lcard" id="li-form" novalidate>'+liSteps(2)+'<h4>'+esc(t('li_enrol_title'))+'</h4><p class="lsub">'+esc(t('li_enrol_sub'))+'</p>'
        +qr+liCode()+liMsg()+liBtn('li_enrol_on')+'</form>';
    } else if(sc==='noauth'){
      c='<div class="lcard"><h4>'+esc(t('li_noauth_title'))+'</h4><p class="lsub">'+esc(t('li_noauth_sub'))+'</p><p class="lwho">'+esc(t('li_signed_as'))+' <b>'+esc(AUTH.email())+'</b></p><button class="lbtn sec" type="button" id="li-out">'+esc(t('li_signout'))+'</button></div>';
    } else if(sc==='expired'){
      c='<div class="lcard"><h4>'+esc(t('li_exp_title'))+'</h4><p class="lsub">'+esc(t('li_exp_sub'))+'</p><button class="lbtn" type="button" id="li-again">'+esc(t('li_exp_again'))+'</button></div>';
    } else c='<div class="center">'+esc(t('loading'))+'</div>';
    app.innerHTML=liHeader()+c;
    bindChrome(renderLogin);
    var f=document.getElementById('li-form');
    if(f)f.onsubmit=function(ev){ev.preventDefault();liSubmit();};
    var el;
    if((el=document.getElementById('li-back')))el.onclick=function(){AUTH.signOut();liReset('signin');renderLogin();};
    if((el=document.getElementById('li-out')))el.onclick=function(){AUTH.signOut().then(function(){liReset('signin');renderLogin();});};
    if((el=document.getElementById('li-again')))el.onclick=function(){liReset('signin');renderLogin();};
    var focus=document.getElementById(sc==='signin'?(LI.email?'li-password':'li-email'):'li-code');
    if(focus&&!LI.busy)try{focus.focus();}catch(e){}
  }
  function liSubmit(){
    if(LI.busy)return;
    var sc=LI.screen;
    LI.busy=true;LI.error=null;
    if(sc==='signin'){
      LI.email=(document.getElementById('li-email').value||'').trim();
      var pw=document.getElementById('li-password').value||'';
      renderLogin();
      AUTH.signIn(LI.email,pw).then(function(r){
        LI.busy=false;
        if(r.error){LI.error=r.error;renderLogin();return;}
        LI.screen=r.screen;renderLogin();
        if(r.screen==='enrol')AUTH.enrol().then(function(x){if(x.error)LI.error=x.error;else{LI.qr=x.qr;LI.secret=x.secret;}renderLogin();});
      });
    } else {
      var code=(document.getElementById('li-code')||{}).value||'';
      renderLogin();
      AUTH.verify(code).then(function(r){
        LI.busy=false;
        if(r.error){LI.error=r.error;renderLogin();return;}
        if(r.screen==='panel'){liReset('panel');startPanel();return;}
        liReset(r.screen);renderLogin();
      });
    }
  }
  function showExpired(){closeStepUp();liReset('expired');renderLogin();}
  function showNoauth(){closeStepUp();liReset('noauth');renderLogin();}
  function startPanel(){LI.screen='panel';load();}

  // ---- step-up dialog: a change more than 15 min after the last code asks for a fresh one (AU3)
  var SU_DONE=null;
  function suEl(id){return document.getElementById(id);}
  function openStepUp(done){
    SU_DONE=done;
    suEl('su-t').textContent=t('li_step_title');suEl('su-p').textContent=t('li_step_sub');suEl('su-l').textContent=t('li_code');
    suEl('su-cancel').textContent=t('btn_cancel');suEl('su-go').textContent=t('btn_confirm');
    var er=suEl('su-err');er.hidden=true;er.textContent='';
    var inp=suEl('su-code');inp.value='';inp.classList.remove('errb');
    suEl('su-go').disabled=false;
    suEl('stepup').style.display='flex';
    setTimeout(function(){try{inp.focus();}catch(e){}},0);
  }
  function closeStepUp(){var el=suEl('stepup');if(el)el.style.display='none';SU_DONE=null;}
  suEl('su-cancel').onclick=function(){closeStepUp();if(PM&&PM.busy){PM.busy=false;renderPrem();}if(MS&&(MS.busy||(MS.wd&&MS.wd.busy)||(MS.tr&&MS.tr.phase==='checking'))){MS.busy=false;if(MS.wd)MS.wd.busy=false;if(MS.tr&&MS.tr.phase==='checking')MS.tr=null;renderMsg();}if(RS&&RS.busy){RS.busy=false;renderRs();}};
  suEl('su-form').onsubmit=function(ev){
    ev.preventDefault();
    var go=suEl('su-go'),er=suEl('su-err'),inp=suEl('su-code');
    go.disabled=true;
    AUTH.stepUp(inp.value).then(function(r){
      go.disabled=false;
      if(r.expired){showExpired();return;}
      if(r.error){er.textContent=t(r.error);er.hidden=false;inp.classList.add('errb');inp.value='';try{inp.focus();}catch(e){}return;}
      var done=SU_DONE;closeStepUp();if(done)done();
    });
  };

  // Language and theme controls, shared by the login screens and the panel.
  function bindChrome(rr){
    document.getElementById('lang').onchange=function(){LANG=this.value;try{localStorage.setItem('dt_adm_lang',LANG);}catch(e){}periods=periods.map(function(p){return periodFor(gran,p.start);});rr();};
    document.getElementById('theme').onclick=function(){var toLight=curTheme()!=='light';if(toLight)document.documentElement.setAttribute('data-theme','light');else document.documentElement.removeAttribute('data-theme');try{localStorage.setItem('dt_adm_theme',toLight?'light':'dark');}catch(e){}rr();};
  }

  function render(){
    clearCharts();
    var h='<header class="top"><div class="brand"><span class="dot"></span>DoseTrace Admin</div>'
      +'<div class="controls">'+langSelect()+themeBtn()
      +'<span class="meta">'+t('updated',{d:esc(new Date(D.generated_at||Date.now()).toLocaleString(LANG))})+'</span>'
      +'<button id="refresh">'+t('refresh')+'</button><button id="signout">'+esc(t('li_signout'))+'</button></div></header>';
    h+=tabsBar();
    h+='<nav class="sections">'+navItems().map(function(n){return '<a href="#'+n[0]+'">'+t(n[1])+'</a>';}).join('')+'</nav>';
    if(TAB==='mgmt'){
      if(MG){h+=secHeadline();h+=secFunnel();h+=secRecon();h+=secCharts();}
      else h+='<section><div class="card muted">'+t('mv_na')+'</div></section>';
      h+=secSources();
    } else if(TAB==='accounts'){
      h+=secAccounts();
    } else {
      h+='<div class="sub muted" style="margin-top:10px">'+t('details_note')+'</div>';
      h+=secOverview();
      h+='<section id="compare"><h2>'+t('sec_compare')+'</h2>'+comparator()+'<div style="height:12px"></div>'+cmpTable()+'<div class="card" style="margin-top:12px"><h3>'+t('side_by_side')+'</h3>'+srcBtn('C3,C4,C5')+'<canvas id="c-cmp" height="90"></canvas></div></section>';
      h+=secEngagement();h+=secAdoption();h+=secProduct();h+=secRevenue();h+=secAudience();h+=secStores();
    }
    app.innerHTML=h;
    if(TAB==='mgmt'){if(MG)drawCharts();} else if(TAB==='details'){drawCmp();drawEngagement();}
    document.getElementById('refresh').onclick=load;
    document.getElementById('signout').onclick=function(){AUTH.signOut().then(function(){D={};MG=null;liReset('signin');renderLogin();});};
    bindChrome(render);
  }
  window.setGran=function(g){gran=g;periods=presets(g);render();};
  window.setTab=function(x){TAB=(x==='details'||x==='accounts')?x:'mgmt';try{localStorage.setItem('dt_adm_tab',TAB);}catch(e){}render();};
  window.setMwin=function(n){MWIN=[7,30,90].indexOf(n)>=0?n:30;render();};
  window.addPeriod=function(){var el=document.getElementById('addp');if(!el||!el.value)return;periods.push(periodFor(gran,pd(el.value)));render();};
  window.rmPeriod=function(i){periods.splice(i,1);if(!periods.length)periods=presets(gran);render();};

  function load(){
    app.innerHTML='<div class="center">'+t('loading')+'</div>';
    AUTH.api('GET').then(function(x){
      if(x.expired){showExpired();return null;}
      if(x.noauth){showNoauth();return null;}
      if(x.status===0)throw new Error(t('li_err_conn'));
      if(x.status===503)throw new Error(t('err_notconf'));
      if(x.status!==200||!x.j)throw new Error(t('err_failed',{n:x.status}));
      return x.j;
    }).then(function(payload){
      if(!payload)return;
      var S=payload.sources||{};var sb=S.supabase||{};
      RC=S.revenuecat||{};AP=S.apple||{};GP=S.google_play||{};
      if(sb.status!=='ok'||!sb.data){app.innerHTML='<div class="center">'+t('supabase_status',{s:esc(sb.status||'')})+(sb.message?(' — '+esc(sb.message)):'')+'</div>';return;}
      D=sb.data;D.generated_at=payload.generated_at||D.generated_at;
      MG=payload.management||null;
      KPI=D.kpi_timeseries||[];UDIM=D.users_dim||[];
      periods=presets(gran);
      render();
      if(US)usLoad(true);
    }).catch(function(e){app.innerHTML='<div class="center">'+esc(e.message||e)+'</div>';});
  }
  // 3.1: no token prompt. A stored aal2 session (12 h at most) opens the panel; otherwise the sign-in
  // screen. An open panel turns into "session expired" when the 12 h pass, with no further request.
  AUTH.start().then(function(r){if(r.screen==='panel')startPanel();else{liReset(r.screen);renderLogin();}});
  setInterval(function(){if(AUTH.expiredNow()){AUTH.drop();showExpired();}},30000);
})();
</script>
</body>
