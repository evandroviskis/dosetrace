<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>DoseTrace Admin</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0C1B2E; --surface:#12263C; --surface2:#183454; --line:#22405f;
    --ink:#EAF2FB; --muted:#8FA6BD; --accent:#4FA3E8; --accent2:#46C6EE;
    --good:#2CD3A7; --warn:#E8B54F; --bad:#E8776B;
    --navbg:rgba(12,27,46,.92); --accent-ink:#04121f; --scrim:rgba(4,10,18,.6);
  }
  :root[data-theme="light"]{
    --bg:#EEF3F9; --surface:#FFFFFF; --surface2:#F1F5FA; --line:#D6E0EC;
    --ink:#0C2340; --muted:#5A7085; --accent:#2A78C2; --accent2:#2AA0C8;
    --good:#159A78; --warn:#B5831C; --bad:#CC4B3D;
    --navbg:rgba(238,243,249,.92); --accent-ink:#FFFFFF; --scrim:rgba(12,27,46,.45);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--accent)}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 20px 80px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.01em}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .meta{color:var(--muted);font-size:12.5px}
  button{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:7px 13px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
  button.icon{padding:7px 11px;font-size:15px;line-height:1}
  select{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;cursor:pointer}
  nav.sections{position:sticky;top:0;z-index:40;background:var(--navbg);backdrop-filter:blur(6px);display:flex;gap:6px;flex-wrap:wrap;padding:10px 0;margin:6px 0 4px;border-bottom:1px solid var(--line)}
  nav.sections a{color:var(--muted);text-decoration:none;font-weight:600;font-size:13.5px;padding:6px 11px;border-radius:8px}
  nav.sections a.active,nav.sections a:hover{color:var(--ink);background:var(--surface)}
  section{padding-top:22px;margin-top:8px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px;font-weight:700;display:flex;align-items:center;gap:8px}
  h3{font-size:13.5px;margin:0 0 10px;color:var(--ink);font-weight:700}
  .grid{display:grid;gap:12px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .two{grid-template-columns:1fr 1fr}.three{grid-template-columns:1fr 1fr 1fr}
  @media(max-width:820px){.two,.three{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
  .kpi .label{color:var(--muted);font-size:12px;font-weight:600}
  .kpi .val{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
  .kpi .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .row{display:flex;align-items:center;gap:10px;margin:7px 0}
  .row .k{width:160px;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .track{flex:1;background:var(--surface2);border-radius:6px;height:15px;overflow:hidden}
  .row .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .row .n{width:52px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  table.cmp{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  table.cmp th,table.cmp td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);font-size:13.5px}
  table.cmp th:first-child,table.cmp td:first-child{text-align:left;color:var(--muted);font-weight:600}
  table.cmp th{color:var(--muted);font-weight:600;font-size:12px}
  .delta{font-size:11.5px;font-weight:700;margin-left:6px}
  .up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--muted)}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
  .pill.ok{background:rgba(44,211,167,.15);color:var(--good)}
  .pill.off{background:rgba(143,166,189,.15);color:var(--muted)}
  .pill.err{background:rgba(232,119,107,.15);color:var(--bad)}
  .muted{color:var(--muted)}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 11px;font-size:12.5px;font-weight:600}
  .chip button{padding:0 6px;background:none;border:none;color:var(--muted);font-size:14px;line-height:1}
  .chip button:hover{color:var(--bad)}
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;position:sticky;top:48px;z-index:30}
  input[type=date]{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
  canvas{max-width:100%}
  .info{width:16px;height:16px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);color:var(--muted);font-size:10px;font-weight:800;cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center;line-height:1}
  .info:hover{color:var(--ink);border-color:var(--accent)}
  .heat td{padding:6px 8px;text-align:center;border-radius:6px;font-variant-numeric:tabular-nums;font-size:12.5px}
  .center{min-height:60vh;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted)}
  code{background:var(--surface2);padding:1px 6px;border-radius:5px;font-size:12.5px}
  #gloss{position:fixed;inset:0;background:var(--scrim);display:none;align-items:center;justify-content:center;z-index:80;padding:20px}
  #gloss .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:460px;width:100%;max-height:85vh;overflow-y:auto;padding:20px 22px}
  #gloss .defs h5{margin:14px 0 0;font-size:14px;color:var(--ink)}
  #gloss .defs:first-child h5{margin-top:4px}
  #gloss .defs dl{margin:0}
  #gloss .defs dt{margin-top:10px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  #gloss .defs dd{margin:2px 0 0;color:var(--ink);line-height:1.5}
  .srcrow{margin:-4px 0 10px}
  .kpi .srcrow{margin:8px 0 0}
  .src{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;font-size:11px;font-weight:600;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px}
  .src:hover{color:var(--ink);border-color:var(--accent)}
  .src .ids{color:var(--accent);font-variant-numeric:tabular-nums}
  .tscroll{overflow-x:auto}
  .tabs{display:flex;gap:6px;margin:4px 0 2px}
  .tabs button{font-weight:700}
  .winsel{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
  .winsel .range{color:var(--muted);font-size:12.5px}
  .kpi .plat{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
  .dot-ios,.dot-android,.dot-unknown{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .dot-ios{background:var(--accent)}.dot-android{background:var(--good)}.dot-unknown{background:var(--muted)}
  .nm{color:var(--warn);font-weight:700}
  .nmwhy{color:var(--muted);font-size:12.5px}
  table.mv{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  table.mv th,table.mv td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:13.5px;text-align:right;vertical-align:middle}
  table.mv th:first-child,table.mv td:first-child,table.mv th:nth-child(2),table.mv td:nth-child(2){text-align:left}
  table.mv th{color:var(--muted);font-weight:600;font-size:12px}
  table.mv td.id{color:var(--accent);font-weight:800;width:44px;text-align:left}
  table.mv tr.sub td{color:var(--muted)}
  table.mv tr.sub td:nth-child(2){padding-left:24px}
  .bar{display:inline-block;width:90px;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:8px}
  .bar span{display:block;height:100%;background:var(--accent)}
  .check-ok{color:var(--good);font-weight:700}.check-bad{color:var(--bad);font-weight:700}
  .qsub{color:var(--muted);font-size:12.5px;margin:-6px 0 8px}
  table.g2 td{text-align:center;padding:6px 8px;border-radius:6px;font-size:12.5px}
  ul.rules{margin:0;padding-left:18px;color:var(--ink)}
  ul.rules li{margin:5px 0}
  table.ds{width:100%;border-collapse:collapse}
  table.ds th,table.ds td{padding:9px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);font-size:13px}
  table.ds th{color:var(--muted);font-weight:600;font-size:12px}
  table.ds td.c-id{font-weight:800;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
  table.ds td.c-name{font-weight:600}
  table.ds td.c-src,table.ds td.c-range{color:var(--muted)}
  @media(max-width:640px){
    table.ds thead{display:none}
    table.ds,table.ds tbody,table.ds tr,table.ds td{display:block;width:100%}
    table.ds tr{padding:10px 0;border-bottom:1px solid var(--line)}
    table.ds td{border:none;padding:3px 0}
    table.ds td::before{content:attr(data-l);display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  }
  #gloss h4{margin:0 0 8px;font-size:16px}
  #gloss p{margin:0;color:var(--muted);line-height:1.55}
  #gloss button{margin-top:16px}
</style>
</head>

  // ---- date helpers ----
  // Server dates are UTC 'YYYY-MM-DD'. utcDay(0) = today (UTC), utcDay(6) = six days ago.
  function utcDay(back){return new Date(Date.now()-back*864e5).toISOString().slice(0,10);}
  function pd(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
  function inR(dateStr,start,end){var d=pd(dateStr);return d>=start&&d<end;}
  function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);x.setHours(0,0,0,0);return x;}
  function monMid(d){var x=new Date(d);x.setHours(0,0,0,0);var day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x;}
  function monthStart(d){return new Date(d.getFullYear(),d.getMonth(),1);}
  function fmtD(d){try{return d.toLocaleDateString(LANG,{month:'short',day:'numeric'});}catch(e){return (d.getMonth()+1)+'/'+d.getDate();}}
  function fmtMY(d){try{return d.toLocaleDateString(LANG,{month:'short',year:'numeric'});}catch(e){return (d.getMonth()+1)+'/'+d.getFullYear();}}
  function periodFor(gran,anchor){
    var a=new Date(anchor);a.setHours(0,0,0,0);
    if(gran==='day')return {label:fmtD(a),start:a,end:addDays(a,1)};
    if(gran==='week'){var s=monMid(a);return {label:t('wk')+' '+fmtD(s),start:s,end:addDays(s,7)};}
    var s2=monthStart(a);return {label:fmtMY(s2),start:s2,end:new Date(s2.getFullYear(),s2.getMonth()+1,1)};
  }
  function presets(gran){
    var now=pd(utcDay(0));
    if(gran==='day')return [periodFor('day',now),periodFor('day',addDays(now,-1))];
    if(gran==='week')return [periodFor('week',now),periodFor('week',addDays(now,-7))];
    return [periodFor('month',now),periodFor('month',new Date(now.getFullYear(),now.getMonth()-1,1))];
  }

  function secEngagement(){
    var a=D.adherence||{};var arate=a.total?Math.round(a.taken/a.total*100):0;
    var h='<section id="engagement"><h2>'+t('sec_engagement')+'</h2>';
    h+='<div class="grid two"><div class="card"><h3>'+t('eng_adherence')+' '+iBtn('adherence')+'</h3>'+srcBtn('E1')+'<canvas id="c-adh" height="150"></canvas><div class="sub muted" style="text-align:center;margin-top:6px">'+t('adh_sub',{p:arate,n:fmt(a.total)})+'</div></div>';
    h+='</div>';
    h+='<div class="card" style="margin-top:12px"><h3>'+t('doses_90')+'</h3>'+srcBtn('E3')+'<canvas id="c-doses" height="80"></canvas></div>';
    h+='</section>';return h;
  }
  function drawEngagement(){
    var C=cc();var a=D.adherence||{};
    makeChart('c-adh',{type:'doughnut',data:{labels:[t('taken'),t('missed'),t('skipped')],datasets:[{data:[a.taken||0,a.missed||0,a.skipped||0],backgroundColor:['#2CD3A7','#E8776B','#E8B54F'],borderWidth:0}]},options:{plugins:{legend:{labels:{color:C.ink,boxWidth:12}}}}});
    var d=KPI.slice(-90);
    makeChart('c-doses',{type:'bar',data:{labels:d.map(function(r){return r.date;}),datasets:[{label:t('m_doses'),data:d.map(function(r){return r.doses;}),backgroundColor:'#46C6EE'}]},options:{plugins:{legend:{display:false}},scales:{x:{grid:{color:C.grid},ticks:{color:C.muted,maxTicksLimit:8,font:{size:10}}},y:{grid:{color:C.grid},ticks:{color:C.muted},beginAtZero:true}}}});
  }

  function secAdoption(){
    var fa=D.feature_adoption||{};var total=fa.total_users||0;var feats=fa.features||[];
    var h='<section id="adoption"><h2>'+t('sec_adoption')+'</h2><div class="card">';
    h+='<div class="sub muted">'+t('fa_active',{n:fmt(fa.active_users_30d),total:fmt(total)})+'</div>'+srcBtn('F1,F2');
    if(!feats.length){return h+'<div class="muted">'+t('fa_nodata')+'</div></div></section>';}
    h+='<div class="tscroll"><table class="cmp"><tr><th>'+t('fa_feature')+'</th><th>'+t('fa_reach')+'</th><th>'+t('fa_users')+'</th><th>'+t('fa_events')+'</th></tr>';
    h+=feats.map(function(f){
      var label=t('fa_'+f.event);if(label==='fa_'+f.event)label=titleCase(f.event);
      var reach=total?Math.round(f.users/total*100):0;
      var bar='<span style="display:inline-block;width:80px;height:8px;background:var(--surface2);border-radius:4px;vertical-align:middle;margin-right:8px;overflow:hidden"><span style="display:block;height:100%;width:'+reach+'%;background:var(--accent)"></span></span>';
      return '<tr><td>'+esc(label)+'</td><td>'+bar+reach+'%</td><td>'+fmt(f.users)+(total?' / '+fmt(total):'')+'</td><td>'+fmt(f.events)+'</td></tr>';
    }).join('');
    h+='</table></div><div class="sub muted" style="margin-top:8px">'+t('fa_note')+'</div></div></section>';
    return h;
  }

  // R1 replaced by G2 (Management view, real accounts only). Kept out of the render.
  function secRetention(){
    var cohorts=(D.retention&&D.retention.cohorts)||[];
    if(!cohorts.length)return '<section id="retention"><h2>'+t('sec_retention_short')+' '+iBtn('retention')+'</h2><div class="card">'+srcBtn('R1')+'<div class="muted">'+t('ret_nodata')+'</div></div></section>';
    var maxWk=0;cohorts.forEach(function(c){Object.keys(c.cells||{}).forEach(function(k){maxWk=Math.max(maxWk,+k);});});
    var head='<tr><td style="text-align:left;color:var(--muted)">'+t('ret_cohort_week')+'</td><td style="color:var(--muted)">'+t('ret_users')+'</td>';
    for(var w=0;w<=maxWk;w++)head+='<td style="color:var(--muted)">W'+w+'</td>';head+='</tr>';
    var body=cohorts.map(function(c){
      var tds='';for(var w=0;w<=maxWk;w++){var a=(c.cells||{})[w];if(a==null){tds+='<td class="muted">·</td>';continue;}var p=c.size?Math.round(a/c.size*100):0;var bg='rgba(79,163,232,'+(0.12+0.6*(p/100)).toFixed(2)+')';tds+='<td style="background:'+bg+'">'+p+'%</td>';}
      return '<tr><td style="text-align:left">'+esc(c.cohort)+'</td><td>'+fmt(c.size)+'</td>'+tds+'</tr>';
    }).join('');
    return '<section id="retention"><h2>'+t('sec_retention')+' '+iBtn('retention')+'</h2><div class="card">'+srcBtn('R1')+'<div class="tscroll"><table class="cmp heat">'+head+body+'</table></div><div class="sub muted" style="margin-top:8px">'+t('ret_footer')+'</div></div></section>';
  }

  function secProduct(){
    var p0=periods[0];
    var comp=tally(PROTO,function(x){return x.compound;},p0&&p0.start,p0&&p0.end,'date');
    var srch=tally(SEARCH,function(x){return x.query;},p0&&p0.start,p0&&p0.end,'date');
    var types=tally(PROTO,function(x){return x.type;},p0&&p0.start,p0&&p0.end,'date').map(function(x){return {k:x.k==='recon'?t('type_recon'):(x.k==='rtu'?t('type_rtu'):titleCase(x.k)),n:x.n};});
    var scope=p0?('· '+p0.label):'';
    var h='<section id="product"><h2>'+t('sec_product')+' '+scope+'</h2><div class="grid two">';
    h+='<div class="card"><h3>'+t('prod_top_compounds')+'</h3>'+srcBtn('P1')+rows(comp.slice(0,10))+'</div>';
    h+='<div class="card"><h3>'+t('prod_top_searches')+'</h3>'+srcBtn('P2')+rows(srch.slice(0,10))+'</div></div>';
    h+='<div class="grid two" style="margin-top:12px"><div class="card"><h3>'+t('prod_type')+'</h3>'+srcBtn('P3')+rows(types)+'</div>';
    h+='<div class="card"><h3>'+t('prod_top_biomarkers')+'</h3>'+srcBtn('P4')+rows((D.top_biomarkers||[]).map(function(x){return {k:titleCase(x.k),n:x.n};}).slice(0,10))+'</div></div>';
    h+='<div class="sub muted" style="margin-top:8px">'+t('prod_footer',{label:esc(p0?p0.label:'all')})+'</div></section>';
    return h;
  }

  function secRevenue(){
    var h='<section id="revenue"><h2>'+t('sec_revenue')+' '+statusPill(RC.status)+'</h2>';
    if(RC.status==='ok'&&RC.data&&RC.data.metrics){
      h+='<div class="grid kpis">'+RC.data.metrics.map(function(m){var v=m.unit==='$'?('$'+Number(m.value||0).toLocaleString(LANG,{minimumFractionDigits:2,maximumFractionDigits:2})):fmt(m.value);var term=m.id==='mrr'?'mrr':null;var isIds=/customer|active_users/i.test(String(m.id||''));return kpiCard(isIds?('RevenueCat IDs · '+(m.name||m.id)):(m.name||m.id),v,isIds?t('rule_rcids'):(m.description||''),term,'V1');}).join('')+'</div>';
    } else h+='<div class="card">'+srcBtn('V1')+'<div class="muted">'+esc(RC.message||t('not_configured'))+'</div></div>';
    h+='</section>';return h;
  }

  function secAudience(){
    var p0=periods[0];var use=UDIM;
    if(p0)use=UDIM.filter(function(u){return inR(u.signup_date,p0.start,p0.end);});
    var country=tally(use,function(x){return x.country;},null,null,'signup_date');
    var goal=relabelGoals(tally(use,function(x){return x.goal;},null,null,'signup_date'));
    var activity=relabelAct(tally(use,function(x){return x.activity;},null,null,'signup_date'));
    var gender=tally(use,function(x){return x.gender;},null,null,'signup_date').map(function(x){return {k:titleCase(x.k),n:x.n};});
    var ageBuckets={};use.forEach(function(u){if(u.age==null){ageBuckets[t('not_set')]=(ageBuckets[t('not_set')]||0)+1;return;}var b=u.age<25?'18–24':u.age<35?'25–34':u.age<45?'35–44':u.age<55?'45–54':'55+';ageBuckets[b]=(ageBuckets[b]||0)+1;});
    var age=Object.keys(ageBuckets).map(function(k){return {k:k,n:ageBuckets[k]};}).sort(function(a,b){return b.n-a.n;});
    var scope=p0?t('aud_scope_signups',{label:p0.label}):t('aud_scope_all');
    var h='<section id="audience"><h2>'+t('sec_audience')+' — '+esc(scope)+' ('+use.length+')</h2><div class="grid two">';
    h+='<div class="card"><h3>'+t('aud_country')+'</h3>'+srcBtn('U1')+rows(country.slice(0,10).map(function(x){return {k:x.k==='(unset)'?t('not_set'):x.k,n:x.n};}))+'</div>';
    h+='<div class="card"><h3>'+t('aud_goal')+'</h3>'+srcBtn('U1')+rows(goal.slice(0,12))+'</div></div>';
    h+='<div class="grid three" style="margin-top:12px"><div class="card"><h3>'+t('aud_activity')+'</h3>'+srcBtn('U1')+rows(activity)+'</div><div class="card"><h3>'+t('aud_gender')+'</h3>'+srcBtn('U1')+rows(gender)+'</div><div class="card"><h3>'+t('aud_age')+'</h3>'+srcBtn('U1')+rows(age)+'</div></div></section>';
    return h;
  }

  function secStores(){
    var h='<section id="stores"><h2>'+t('sec_stores')+'</h2>';
    h+='<div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between"><b>'+t('store_apple')+'</b> '+statusPill(AP.status)+'</div>';
    if(AP.status==='ok'&&AP.data){var a=AP.data;h+='<div class="grid kpis" style="margin-top:12px">'+kpiCard(t('k_downloads_30'),fmt(a.downloads_30d),null,null,'S1')+kpiCard(t('k_updates_30'),fmt(a.updates_30d),null,null,'S2')+kpiCard(t('k_latest_day'),a.latest_day_downloads!=null?t('n_dl',{n:fmt(a.latest_day_downloads)}):'—',a.latest_day||'',null,'S3')+'</div>';}
    else h+='<div class="muted" style="margin-top:6px">'+esc(AP.message||'')+'</div>';
    h+='</div><div class="card"><div style="display:flex;justify-content:space-between"><b>'+t('store_google')+'</b> '+statusPill(GP.status)+'</div>';
    if(GP.status==='ok'&&GP.data){var g=GP.data;h+='<div class="grid kpis" style="margin-top:12px">'+kpiCard(t('k_total_installs'),fmt(g.total_user_installs),null,null,'S4')+kpiCard(t('k_active_devices'),fmt(g.active_device_installs),null,null,'S5')+kpiCard(t('k_installs_month'),fmt(g.installs_this_month),null,null,'S6')+kpiCard(t('k_avg_rating'),g.total_average_rating!=null?Number(g.total_average_rating).toFixed(2)+' ★':'—',null,null,'S7')+'</div>';}
    else h+='<div class="muted" style="margin-top:6px">'+esc(GP.message||'')+'</div>';
    h+='</div><div class="sub muted" style="margin-top:8px">S1 · S2 · S6: '+esc(t('s_window_note'))+'</div></section>';return h;
  }

  function secSources(){
    var rules=['rule_utc','rule_test2','rule_rcids','rule_active','rule_window'].map(function(k){return '<li>'+esc(t(k))+'</li>';}).join('');
    var cols=[t('ds_id'),t('ds_metric'),t('ds_source'),t('ds_def'),t('ds_range'),t('ds_proven')];
    var head='<thead><tr>'+cols.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'</tr></thead>';
    var body='<tbody>'+DEFS.map(function(d){
      var cells=[['c-id',d.id],['c-name',d.name],['c-src',d.src],['c-def',d.def],['c-range',d.range]];
      return '<tr>'+cells.map(function(c,i){return '<td class="'+c[0]+'" data-l="'+esc(cols[i])+'">'+esc(c[1])+'</td>';}).join('')
        +'<td data-l="'+esc(cols[5])+'"><span class="pill '+(d.proven?'ok':'off')+'">'+esc(provenLabel(d))+'</span></td></tr>';
    }).join('')+'</tbody>';
    var h='<section id="sources"><h2>'+t('sec_sources')+'</h2>';
    h+='<div class="card"><h3>'+t('ds_rules')+'</h3><ul class="rules">'+rules+'</ul></div>';
    h+='<div class="card" style="margin-top:12px"><table class="ds">'+head+body+'</table>'+(LANG==='en'?'':'<div class="sub muted" style="margin-top:8px">'+esc(t('ds_def_lang'))+'</div>')+'</div></section>';
    return h;
  }

  function navItems(){
    if(TAB==='mgmt')return [['headline','nav_headline'],['funnel','nav_funnel'],['recon','nav_recon'],['charts','nav_charts'],['sources','nav_sources']];
    return [['activity','nav_activity'],['compare','nav_compare'],['engagement','nav_engagement'],['adoption','nav_adoption'],['product','nav_product'],['revenue','nav_revenue'],['audience','nav_audience'],['stores','nav_stores']];
  }
  function tabsBar(){return '<div class="tabs">'+[['mgmt','tab_mgmt'],['details','tab_details']].map(function(x){return '<button class="'+(TAB===x[0]?'on':'')+'" onclick="setTab(\''+x[0]+'\')">'+t(x[1])+'</button>';}).join('')+'</div>';}
  function langSelect(){return '<select id="lang" title="Language">'+LANGS.map(function(l){return '<option value="'+l[0]+'"'+(l[0]===LANG?' selected':'')+'>'+l[1]+'</option>';}).join('')+'</select>';}
  function themeBtn(){var dark=curTheme()==='dark';return '<button id="theme" class="icon" title="'+esc(dark?t('theme_light'):t('theme_dark'))+'">'+(dark?'☀':'☾')+'</button>';}

  function render(){
    clearCharts();
    var h='<header class="top"><div class="brand"><span class="dot"></span>DoseTrace Admin</div>'
      +'<div class="controls">'+langSelect()+themeBtn()
      +'<span class="meta">'+t('updated',{d:esc(new Date(D.generated_at||Date.now()).toLocaleString(LANG))})+'</span>'
      +'<button id="refresh">'+t('refresh')+'</button></div></header>';
    h+=tabsBar();
    h+='<nav class="sections">'+navItems().map(function(n){return '<a href="#'+n[0]+'">'+t(n[1])+'</a>';}).join('')+'</nav>';
    if(TAB==='mgmt'){
      if(MG){h+=secHeadline();h+=secFunnel();h+=secRecon();h+=secCharts();}
      else h+='<section><div class="card muted">'+t('mv_na')+'</div></section>';
      h+=secSources();
    } else {
      h+='<div class="sub muted" style="margin-top:10px">'+t('details_note')+'</div>';
      h+=secOverview();
      h+='<section id="compare"><h2>'+t('sec_compare')+'</h2>'+comparator()+'<div style="height:12px"></div>'+cmpTable()+'<div class="card" style="margin-top:12px"><h3>'+t('side_by_side')+'</h3>'+srcBtn('C2,C3,C4,C5')+'<canvas id="c-cmp" height="90"></canvas></div></section>';
      h+=secEngagement();h+=secAdoption();h+=secProduct();h+=secRevenue();h+=secAudience();h+=secStores();
    }
    app.innerHTML=h;
    if(TAB==='mgmt'){if(MG)drawCharts();} else {drawCmp();drawEngagement();}
    document.getElementById('refresh').onclick=load;
    document.getElementById('lang').onchange=function(){LANG=this.value;try{localStorage.setItem('dt_adm_lang',LANG);}catch(e){}periods=periods.map(function(p){return periodFor(gran,p.start);});render();};
    document.getElementById('theme').onclick=function(){var toLight=curTheme()!=='light';if(toLight)document.documentElement.setAttribute('data-theme','light');else document.documentElement.removeAttribute('data-theme');try{localStorage.setItem('dt_adm_theme',toLight?'light':'dark');}catch(e){}render();};
  }
  window.setGran=function(g){gran=g;periods=presets(g);render();};
  window.setTab=function(x){TAB=x==='details'?'details':'mgmt';try{localStorage.setItem('dt_adm_tab',TAB);}catch(e){}render();};
  window.setMwin=function(n){MWIN=[7,30,90].indexOf(n)>=0?n:30;render();};
  window.addPeriod=function(){var el=document.getElementById('addp');if(!el||!el.value)return;periods.push(periodFor(gran,pd(el.value)));render();};
  window.rmPeriod=function(i){periods.splice(i,1);if(!periods.length)periods=presets(gran);render();};

  function load(){
    app.innerHTML='<div class="center">'+t('loading')+'</div>';
    fetch('/api/adm',{headers:{Authorization:'Bearer '+token}}).then(function(r){
      if(r.status===401){try{sessionStorage.removeItem('dt_adm_token');}catch(e){}token='';throw new Error(t('err_unauth'));}
      if(r.status===503)throw new Error(t('err_notconf'));
      if(!r.ok)throw new Error(t('err_failed',{n:r.status}));return r.json();
    }).then(function(payload){
      var S=payload.sources||{};var sb=S.supabase||{};
      RC=S.revenuecat||{};AP=S.apple||{};GP=S.google_play||{};
      if(sb.status!=='ok'||!sb.data){app.innerHTML='<div class="center">'+t('supabase_status',{s:esc(sb.status||'')})+(sb.message?(' — '+esc(sb.message)):'')+'</div>';return;}
      D=sb.data;D.generated_at=payload.generated_at||D.generated_at;
      MG=payload.management||null;
      KPI=D.kpi_timeseries||[];ACT=D.activity_events||[];UDIM=D.users_dim||[];SEARCH=D.searches||[];PROTO=D.protocols_created_events||[];
      periods=presets(gran);
      render();
    }).catch(function(e){app.innerHTML='<div class="center">'+esc(e.message||e)+'</div>';});
  }
  // No token in this session? Prompt once and keep it in sessionStorage (cleared
  // when the tab closes). A 401 removes it, so a reload asks again.
  if(!token){
    try{ token=(window.prompt('Admin token')||'').trim(); }catch(e){ token=''; }
    if(token){ try{ sessionStorage.setItem('dt_adm_token',token); }catch(e){} }
  }
  if(!token){app.innerHTML='<div class="center">'+t('need_link')+'</div>';return;}
  load();
})();
</script>
</body>
</html>
