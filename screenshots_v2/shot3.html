<div class="caption"><h1>Keep notes where<br>you'll find them</h1></div>

    <div class="sub"><span class="dot" style="display:inline-block;width:18px;height:18px;background:#D4537E;vertical-align:middle;margin-right:10px"></span>Daily · Oral</div>

    </div>
  </div>

    <div class="tab on"><span class="ic">◇</span>Routines</div>
