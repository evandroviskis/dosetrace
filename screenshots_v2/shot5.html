<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"></head><body>
<div class="caption"><h1>A gentle nudge<br>for what's next</h1></div>
<div class="phone"><div class="screen">
  <div class="statusbar"><span>9:41</span><span class="dot"></span></div>
  <div class="notif">
    <div class="icon">☀️</div>
    <div class="nb">
      <div class="nrow"><span class="app">DOSETRACE</span><span class="when">now</span></div>
      <div class="msg">Good morning — your day is ready. First routine at 8:00 AM.</div>
    </div>
  </div>
  <div class="hdr" style="margin-top:20px">
    <div class="date">Wednesday, July 9</div>
    <div class="greet">Good morning 👋</div>
    <div class="sub">2 routines today</div>
  </div>
  <div class="sec">TODAY</div>
  <div class="card">
    <div class="crow"><span class="dot" style="background:#D4537E"></span>
      <div class="info"><div class="name">Morning routine</div><div class="meta">Daily</div></div>
      <div class="time"><div class="t">8:00 AM</div><div class="r">🔔 reminder</div></div></div>
    <span class="badge b-oral">Oral</span>
  </div>
  <div class="card">
    <div class="crow"><span class="dot" style="background:#5DCAA5"></span>
      <div class="info"><div class="name">Daily support</div><div class="meta">Daily</div></div>
      <div class="time"><div class="t">9:00 AM</div><div class="r">🔔 reminder</div></div></div>
    <span class="badge b-oral">Oral</span>
  </div>
  <div class="tabbar">
    <div class="tab on"><span class="ic">▦</span>Today</div>
    <div class="tab"><span class="ic">◇</span>Routines</div>
    <div class="tab"><span class="ic">▤</span>Log</div>
    <div class="tab"><span class="ic">▧</span>Notes</div>
    <div class="tab"><span class="ic">◔</span>You</div>
  </div>
</div></div></body></html>
