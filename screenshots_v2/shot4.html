<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"></head><body>
<div class="caption"><h1>Look back<br>anytime</h1></div>
<div class="phone"><div class="screen">
  <div class="statusbar"><span>9:41</span><span class="dot"></span></div>
  <div class="hdr"><div class="title">Log</div></div>
  <div class="stats">
    <div class="stat green"><div class="v">24</div><div class="l">Done</div></div>
    <div class="stat red"><div class="v">2</div><div class="l">Skipped</div></div>
    <div class="stat amber"><div class="v">1</div><div class="l">Late</div></div>
  </div>
  <div class="pills"><div class="pill on">All</div><div class="pill">Done</div><div class="pill">Skipped</div></div>
  <div class="sec" style="margin-top:8px">WEDNESDAY, JULY 9</div>
  <div class="logentry"><span class="logdot" style="background:#1D9E75"></span>
    <div class="info"><div class="name" style="font-size:28px">Morning routine</div><div class="meta" style="font-size:21px">📝 Take with breakfast</div></div>
    <div class="time"><div class="t" style="font-size:22px">9:12 AM</div></div>
    <span class="logbadge b-rtu">Done</span></div>
  <div class="logentry"><span class="logdot" style="background:#5DCAA5"></span>
    <div class="info"><div class="name" style="font-size:28px">Daily support</div></div>
    <div class="time"><div class="t" style="font-size:22px">9:05 AM</div></div>
    <span class="logbadge b-rtu">Done</span></div>
  <div class="sec">TUESDAY, JULY 8</div>
  <div class="logentry"><span class="logdot" style="background:#D4537E"></span>
    <div class="info"><div class="name" style="font-size:28px">Morning routine</div></div>
    <div class="time"><div class="t" style="font-size:22px">8:20 AM</div></div>
    <span class="logbadge b-rtu">Done</span></div>
  <div class="logentry"><span class="logdot" style="background:#378ADD"></span>
    <div class="info"><div class="name" style="font-size:28px">Recovery blend</div></div>
    <div class="time"><div class="t" style="font-size:22px">7:30 PM</div></div>
    <span class="logbadge b-amber" style="background:#FAEEDA;color:#633806">Late</span></div>
  <div class="tabbar">
    <div class="tab"><span class="ic">▦</span>Today</div>
    <div class="tab"><span class="ic">◇</span>Routines</div>
    <div class="tab on"><span class="ic">▤</span>Log</div>
    <div class="tab"><span class="ic">▧</span>Notes</div>
    <div class="tab"><span class="ic">◔</span>You</div>
  </div>
</div></div></body></html>
