<!doctype html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  html,body { width:1024px; height:500px; }
  body { font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
    background:linear-gradient(120deg,#0f3f78 0%,#185FA5 60%,#2E7BC4 100%); overflow:hidden; position:relative; }
  .wrap { position:absolute; left:70px; top:0; height:500px; display:flex; flex-direction:column; justify-content:center; width:620px; }
  .brand { display:flex; align-items:center; gap:18px; margin-bottom:22px; }
  .logo { width:70px; height:70px; border-radius:18px; background:#fff; display:flex; align-items:center; justify-content:center; }
  .logo span { font-size:44px; }
  .name { font-size:52px; font-weight:800; color:#fff; letter-spacing:-.5px; }
  .tag { font-size:38px; font-weight:600; color:#fff; line-height:1.2; }
  .pills { display:flex; gap:14px; margin-top:28px; }
  .pill { font-size:22px; color:#0f3f78; background:#dbeafe; padding:12px 22px; border-radius:22px; font-weight:600; }
  .phone { position:absolute; right:-30px; top:70px; width:300px; height:600px; background:#000; border-radius:44px; padding:9px; transform:rotate(-8deg); box-shadow:0 30px 60px rgba(0,0,0,.35); }
  .scr { width:100%; height:100%; background:#fafafa; border-radius:36px; overflow:hidden; }
  .sh { background:#fff; padding:26px 22px 16px; }
  .sh .g { font-size:26px; font-weight:800; color:#111; }
  .sh .s { font-size:15px; color:#888; margin-top:3px; }
  .mc { background:#fff; border:1px solid #ececec; border-radius:18px; margin:12px 16px; padding:16px; }
  .mc .n { font-size:19px; font-weight:700; color:#111; }
  .mc .m { font-size:14px; color:#888; margin-top:2px; }
  .mc .bd { display:inline-block; margin-top:10px; font-size:13px; padding:3px 12px; border-radius:10px; background:#FAEEDA; color:#633806; }
  .lbl { font-size:13px; font-weight:700; letter-spacing:1px; color:#aaa; margin:14px 18px 4px; }
</style></head><body>
  <div class="wrap">
    <div class="brand"><div class="logo"><span>🗓️</span></div><div class="name">DoseTrace</div></div>
    <div class="tag">A simple, private journal<br>for your everyday routines</div>
    <div class="pills"><div class="pill">Reminders</div><div class="pill">Daily log</div><div class="pill">Private &amp; offline</div></div>
  </div>
  <div class="phone"><div class="scr">
    <div class="sh"><div class="g">Good morning 👋</div><div class="s">1 of 2 done today</div></div>
    <div class="lbl">TODAY</div>
    <div class="mc"><div class="n">Morning routine</div><div class="m">Daily · 8:00 AM</div><span class="bd">Oral</span></div>
    <div class="lbl">TOMORROW</div>
    <div class="mc" style="opacity:.6"><div class="n">Recovery blend</div><div class="m">Every 3 days</div><span class="bd" style="background:#E1F5EE;color:#085041">Ready-to-use</span></div>
  </div></div>
</body></html>
