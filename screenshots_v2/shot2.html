<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"></head><body>
<div class="caption"><h1>Build your<br>own routine</h1></div>
<div class="phone"><div class="screen">
  <div class="statusbar"><span>9:41</span><span class="dot"></span></div>
  <div class="hdr row"><div class="title">Routines</div><div class="addbtn">+ Add</div></div>
  <div class="pills">
    <div class="pill on">Due next</div><div class="pill">A–Z</div><div class="pill">By type</div>
  </div>
  <div class="card">
    <div class="crow"><span class="dot" style="background:#D4537E"></span>
      <div class="info"><div class="name">Morning routine</div><div class="meta">Daily · 8:00 AM</div></div>
      <span class="chev">›</span></div>
    <span class="badge b-oral">Oral</span>
  </div>
  <div class="card">
    <div class="crow"><span class="dot" style="background:#378ADD"></span>
      <div class="info"><div class="name">Recovery blend</div><div class="meta">Every 3 days · 7:00 PM</div></div>
      <span class="chev">›</span></div>
    <span class="badge b-rtu">Ready-to-use</span>
  </div>
  <div class="card">
    <div class="crow"><span class="dot" style="background:#5DCAA5"></span>
      <div class="info"><div class="name">Daily support</div><div class="meta">Daily · 9:00 AM</div></div>
      <span class="chev">›</span></div>
    <span class="badge b-oral">Oral</span>
  </div>
  <div class="card">
    <div class="crow"><span class="dot" style="background:#BA7517"></span>
      <div class="info"><div class="name">Weekend reset</div><div class="meta">Weekly · Sat 10:00 AM</div></div>
      <span class="chev">›</span></div>
    <span class="badge b-rtu">Ready-to-use</span>
  </div>
  <div class="tabbar">
    <div class="tab"><span class="ic">▦</span>Today</div>
    <div class="tab on"><span class="ic">◇</span>Routines</div>
    <div class="tab"><span class="ic">▤</span>Log</div>
    <div class="tab"><span class="ic">▧</span>Notes</div>
    <div class="tab"><span class="ic">◔</span>You</div>
  </div>
</div></div></body></html>
